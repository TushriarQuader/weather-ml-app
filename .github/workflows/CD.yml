# Name of the GitHub Actions deployment workflow.
name: Continuous Deployment

# Deploy after CI succeeds on main, or when triggered manually.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  validate-kubernetes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Use a GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Download the repository files onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Install kubectl for Kubernetes configuration validation.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      # Check that the Deployment and Service manifests are valid YAML.
      - name: Validate Kubernetes manifests
        run: |
          # Validate YAML structure without connecting to a cluster.
          python -m pip install pyyaml
          python -<<'PY'
          import yaml
          for file in ["k8s/deployment.yaml", "k8s/service.yaml"]:
              with open(file) as f:
                  yaml.safe_load(f)
              print(f"Successfully validated {file}")
          PY

      # Validate Kubernetes resources against their official schemas.
      - name: Validate Kubernetes schemas
        run: |
          # Download the Kubeconform Linux executable.
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz

          # Extract the executable from the downloaded archive.
          tar -xzf kubeconform.tar.gz kubeconform

          # Check both Kubernetes manifests in strict mode.
          ./kubeconform -strict -summary k8s/deployment.yaml k8s/service.yaml

  deploy-to-ec2:
    needs: validate-kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use the commit that CI actually built and pushed, not the default branch SHA.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Fail early with a clear message instead of an opaque SSH error.
      - name: Validate deployment inputs
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          # GitHub masks secret values in logs, so these checks never print them.
          if [ -z "$SSH_HOST" ]; then
            echo "EC2_HOST secret is empty"
            exit 1
          fi
          case "$SSH_HOST" in
            *"://"*|*" "*) echo "EC2_HOST must be a bare hostname or IP address"; exit 1 ;;
          esac
          case "$SSH_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "EC2_SSH_KEY does not contain a private key"; exit 1 ;;
          esac
          if [ -z "$HOST_FINGERPRINT" ]; then
            echo "Warning: EC2_HOST_FINGERPRINT is empty; host key verification is skipped"
          fi
          echo "Deployment inputs look valid"

      # Manual runs can target a commit CI never published, so check the tag first.
      - name: Verify Docker image exists
        run: |
          curl --fail --silent --show-error \
            "https://hub.docker.com/v2/repositories/tquade200/weather-ml-app/tags/${DEPLOY_SHA}" \
            > /dev/null
          echo "Image tquade200/weather-ml-app:${DEPLOY_SHA} is available"

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          # The script runs apt, Minikube and a 300s rollout, so 20ms could never work.
          command_timeout: 10m
          script: |
            set -eu

            echo "Deploying tquade200/weather-ml-app:${DEPLOY_SHA}"

            # Bootstrap the checkout on a fresh instance; later runs just pull.
            if [ ! -d /home/ubuntu/weather-ml-app/.git ]; then
              git clone https://github.com/TushriarQuader/weather-ml-app.git /home/ubuntu/weather-ml-app
            fi

            cd /home/ubuntu/weather-ml-app
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            ansible-playbook -i localhost, -c local prodservconf.yaml

            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml

            kubectl set image deployment/weather-ml-app \
              weather-ml-app=tquade200/weather-ml-app:${DEPLOY_SHA}

            kubectl rollout status \
              deployment/weather-ml-app --timeout=300s

            # Expose the app on the EC2 host's port 5000.
            sudo tee /etc/systemd/system/weather-portforward.service >/dev/null <<'EOF'
            [Unit]
            Description=Expose weather app on port 5000
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=ubuntu
            Environment=KUBECONFIG=/home/ubuntu/.kube/config
            ExecStart=/usr/local/bin/kubectl port-forward --address 0.0.0.0 service/weather-app-service 5000:5000
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable weather-portforward.service
            sudo systemctl restart weather-portforward.service
            sleep 3
            sudo systemctl is-active --quiet weather-portforward.service

            kubectl get pods
            kubectl get services

            echo "Deployment of ${DEPLOY_SHA} complete"
