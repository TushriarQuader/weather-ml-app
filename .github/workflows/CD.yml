
# Name of the GitHub Actions deployment workflow.
name: Continuous Deployment

# Allow manual execution while we configure Kubernetes.
on:
  push:
    branches:
      - ci-cd-pipeline
  workflow_dispatch:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  validate-kubernetes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Use a GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Download the repository files onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Install kubectl for Kubernetes configuration validation.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      # Check that the Deployment and Service manifests are valid YAML.
      - name: Validate Kubernetes manifests
        run: |
          # Validate YAML structure without connecting to a cluster.
          python -m pip install pyyaml
          python -<<'PY'
          import yaml
          for file in ["k8s/deployment.yaml", "k8s/service.yaml"]:
              with open(file) as f:
                  yaml.safe_load(f)
              print(f"Successfully validated {file}")
          PY
          # Parse both Kubernetes configuration files.
      
      # Validate Kubernetes resources against their official schemas.
      - name: Validate Kubernetes schemas
        run: |
          # Download the Kubeconform Linux executable.
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz

          # Extract the executable from the downloaded archive.
          tar -xzf kubeconform.tar.gz kubeconform

          # Check both Kubernetes manifests in strict mode.
          ./kubeconform -strict -summary k8s/deployment.yaml k8s/service.yaml
          
  deploy-to-ec2:
        needs: validate-kubernetes
        runs-on: ubuntu-latest

        steps:
          - name: Deploy application to EC2
            uses: appleboy/ssh-action@v1.2.0
            env:
              DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ubuntu
              key: ${{ secrets.EC2_SSH_KEY }}
              fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
              envs: DEPLOY_SHA
              command_timeout: 20ms

              script: |
                set -eu

                cd /home/ubuntu/weather-ml-app
                git fetch origin main
                git checkout main
                git pull --ff-only origin main
    
                ansible-playbook -i localhost, -c local prodservconf.yaml
    
                kubectl apply -f k8s/deployment.yaml
                kubectl apply -f k8s/service.yaml
    
                kubectl set image deployment/weather-ml-app \
                  weather-ml-app=patricianwani/weather-ml-app:${DEPLOY_SHA}
    
                kubectl rollout status \
                  deployment/weather-ml-app --timeout=300s
    
                kubectl get pods
                kubectl get services
         
