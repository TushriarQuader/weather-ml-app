
# Display name of our GitHub Actions workflow.
name: Continuous Integration

# Automatically run when code is pushed to either branch.
on:
  push:
    branches:
      - main
      - ci-cd-pipeline

jobs:
  build-and-test:
    # Use a GitHub-hosted Ubuntu machine.
    runs-on: ubuntu-latest

    steps:
      # Download the project's code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python for running our application tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install the libraries needed by the application.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Flask

      # Check that the Flask homepage loads successfully.
      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "smoke_test.py" -v

      # Test the model and individual application functions.
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "unit_test.py" -v

      # Test that the Flask application and ML model work together.
      - name: Run integration tests
        run: python -m unittest discover -s tests -p "integration_test.py" -v

      # Build a Docker image containing the Flask application.
      - name: Build Docker image
        run: docker build -t weather-ml-app:test .

      # Start the container and check that the Flask homepage responds.
      - name: Test Docker container
        run: |
          # Start the container in the background and map port 5000.
          docker run -d --name weather-test -p 5000:5000 weather-ml-app:test

          # Give the application time to start.
          sleep 5

          # Check the application's homepage.
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:5000/

      # Remove the test container, even if an earlier step fails.
      - name: Clean up Docker container
        if: always()
        run: docker rm -f weather-test || true
